[prior]
a_min = 0.0
a_max = 0.98
incl_min_deg = 5.0
incl_max_deg = 80.0
logit_clip = 1e-6

[scene]
mass = 1.0
camera_distance = 85.0
fov_deg = 22.0
width = 64
height = 64
supersample = 3
r_in = 0.0
r_out = 15.0

[emission]
model = "stylized"
g_power = 3.0
emissivity_index = 2.0

[simulator]
version = "0.2.0"
timeout_seconds = 120.0
smoke_png = false

[observation]
sigma_psf = 1.0
kernel_size = 7
flux_sum = 4096.0
sigma_n = "pending_m2"
s = "training_median"
asinh_scale_factor = 0.1

[emission_check]
blackbody_t_in = 40000.0
spins = [0.0, 0.5, 0.98]
inclinations_deg = [5.0, 45.0, 80.0]
asinh_peak_fraction = 0.1
achromatic_tolerance = 1e-6
peak_range_limit = 100.0
figure_dpi = 180

[sensitivity]
a_min = 0.02
a_max = 0.96
a_count = 8
incl_min_deg = 8.0
incl_max_deg = 78.0
incl_count = 8
delta_a = 0.02
delta_incl_deg = 1.0
noise_peak_fractions = [0.01, 0.03, 0.1, 0.3]
robustness_indices = [[1, 1], [1, 6], [6, 1], [6, 6]]
robustness_step_factor = 2.0
robustness_relative_tolerance = 0.2
derivative_indices = [[1, 1], [6, 1], [6, 6]]
singular_tolerance = 1e-12
well_constrained_sigma_a = 0.05
weakly_constrained_sigma_a = 0.2
figure_dpi = 180

[derivative_check]
step_factors = [1.0, 0.5, 0.25]
relative_tolerance = 0.2
diagnostic_sigma_n = 20.0
figure_dpi = 180

[training]
seed = 1
batch_size = 256
learning_rate = 3e-4
warmup_steps = 500
weight_decay = 1e-4
gradient_clip = 1.0
validation_fraction = 0.1
validation_noise_seed = 42
patience = 20
max_epochs = 200
embedding_dim = 64
flow_layers = 6
spline_knots = 8
spline_interval = 5.0

[paths]
scene_template = "configs/scene_template.toml"
data = "data"
runs = "runs"
logs = "logs"
figures = "results/figures"
results = "results"
